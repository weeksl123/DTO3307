{% extends 'signin_base.html' %}

{% block head %}
    <title>Sign up</title>
{% endblock %}

{% block heading%}
    <h2>Sign up</h2>
{% endblock %}

{% block form %}
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>
{% endblock %}

{% block form1 %}
    <label for="con-password">Confirm Password:</label><br>
    <input type="password" id="con-password" name="con-password" required><br><br>
    <button type="submit">Sign Up</button>
{% endblock %}

{% block switch %}
    <p>Already have an account? <a href="{{ url_for('sign_in') }}">Sign in!</a></p>
{% endblock %}
